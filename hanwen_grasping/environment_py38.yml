# Conda environment for new_setup.py (Python 3.8)
# Use: conda env create -f environment_py38.yml
# Then run: conda activate grasping_py38 && bash setup_ros_trac_ik.sh (builds trac_ik via catkin)
# Then run: bash setup_grasping_py38.sh
# NOTE: Use Boost 1.71 for custom OMPL py-bindings compatibility (no conda ompl)
# NOTE: trac_ik = original ROS version (apt or catkin-built), no tracikpy

name: grasping_py38
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.8
  - pip
  # Boost 1.71 for OMPL custom py-bindings (must come from defaults)
  - boost=1.71
  # Core deps for OMPL and trac_ik catkin build
  - libode
  - nlopt
  - eigen
  - swig
  # Scientific
  - numpy
  - scipy
  - pyyaml
  - pillow
  # Visualization
  - opencv
  - pyvista
  - open3d
  # PyTorch (for Isaac Gym gymtorch)
  - pytorch
  - torchvision
  - pip:
    - opencv-python
    - python-fcl
    - numpy-stl
