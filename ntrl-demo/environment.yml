# Conda environment for ntrl-demo (migrated from Docker)
# Compatible with PyTorch 1.12.1 + CUDA 11.3 (matches original Docker base image)

name: ntrl-demo

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - pytorch=1.12.1
  - torchvision=0.13.1
  - torchaudio=0.12.1
  - cudatoolkit=11.3
  - numpy
  - matplotlib
  - scipy
  - pip

  - pip:
    - pickle5
    - libigl
    - pytorch_kinematics
    - configargparse
    - torch-kdtree
    - functorch
    - trimesh
    - "pyglet<2"  # trimesh.viewer.windowed requires pyglet 1.x
